<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Help Desk — Submit a Support Request</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fff;
      color: #1a1a1a;
      max-width: 760px;
      margin: 60px auto;
      padding: 0 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0 0 8px;
    }
    .subtitle {
      color: #555;
      font-size: 16px;
      margin: 0 0 36px;
    }
    .row {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
    }
    .field {
      flex: 1;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #444;
      margin-bottom: 8px;
    }
    input, textarea {
      width: 100%;
      font-size: 16px;
      padding: 14px 16px;
      border: 1px solid #d6d6d6;
      border-radius: 8px;
      font-family: inherit;
      color: #1a1a1a;
      resize: vertical;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #8a8a8a;
    }
    textarea {
      min-height: 180px;
    }
    .char-count {
      text-align: right;
      font-size: 13px;
      color: #999;
      margin-top: 6px;
    }
    hr {
      border: none;
      border-top: 1px solid #e5e5e5;
      margin: 32px 0 24px;
    }
    button {
      width: 100%;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      border: 1px solid #d6d6d6;
      border-radius: 8px;
      background: #fff;
      color: #1a1a1a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button:hover {
      background: #f7f7f7;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .status {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      font-size: 15px;
      display: none;
    }
    .status.success {
      display: block;
      background: #f0f9f1;
      border: 1px solid #bfe3c4;
      color: #1f5d2c;
    }
    .status.error {
      display: block;
      background: #fbeeee;
      border: 1px solid #eec3c3;
      color: #7a1f1f;
    }
  </style>
</head>
<body>
  <h1>Submit a support request</h1>
  <p class="subtitle">We typically respond within 24 hours. For urgent issues, mark your subject accordingly.</p>

  <form id="ticket-form">
    <div class="row">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Jane Smith" required>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="jane@company.com" required>
      </div>
    </div>

    <div class="field" style="margin-bottom: 24px;">
      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" placeholder="Brief description of your issue" required>
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" maxlength="2000" placeholder="Describe your issue in detail — what happened, what you expected, any error messages..." required></textarea>
      <div class="char-count"><span id="char-count">0</span> / 2000</div>
    </div>

    <hr>

    <button type="submit" id="submit-btn">Send request</button>

    <div class="status" id="status"></div>
  </form>

  <script>
    const form = document.getElementById('ticket-form');
    const messageField = document.getElementById('message');
    const charCount = document.getElementById('char-count');
    const submitBtn = document.getElementById('submit-btn');
    const status = document.getElementById('status');

    messageField.addEventListener('input', () => {
      charCount.textContent = messageField.value.length;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.className = 'status';
      status.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        subject: document.getElementById('subject').value,
        message: messageField.value
      };

      try {
        const res = await fetch('/api/tickets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.success) {
          status.className = 'status success';
          status.textContent = `Thanks — your ticket has been logged (ID: ${data.ticketId}). Category: ${data.category}, Priority: ${data.priority}, Assigned to: ${data.assignedAgent}. ${data.message}`;
          form.reset();
          charCount.textContent = '0';
        } else {
          status.className = 'status error';
          status.textContent = data.error || 'Something went wrong. Please try again.';
        }
      } catch (err) {
        status.className = 'status error';
        status.textContent = 'Something went wrong. Please try again.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send request';
      }
    });
  </script>
</body>
</html>
