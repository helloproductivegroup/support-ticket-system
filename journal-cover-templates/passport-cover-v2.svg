<?xml version="1.0" encoding="UTF-8"?>
<!-- Passport trifold traveler's cover V2
     Piece: 268 x 132 mm. Verify this size after importing.
     Layer "CUT"  = outline + 7 holes (6 elastic @ 2.5 mm, 1 closure @ 3 mm).
     Layer "FOLD" = score lines: set FOLD to Pen/Draw or delete it.
     Do NOT leave FOLD set to Cut - it will slice the cover into strips. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="268mm" height="132mm" viewBox="0 0 268 132">
<g id="CUT">
  <path fill="#000000" fill-rule="evenodd" stroke="none"
        d="M 4,0 H 264 A 4,4 0 0 1 268,4 V 128 A 4,4 0 0 1 264,132 H 4 A 4,4 0 0 1 0,128 V 4 A 4,4 0 0 1 4,0 Z M 96.75,10 a 1.25,1.25 0 1 0 2.5,0 a 1.25,1.25 0 1 0 -2.5,0 Z M 103.75,10 a 1.25,1.25 0 1 0 2.5,0 a 1.25,1.25 0 1 0 -2.5,0 Z M 110.75,10 a 1.25,1.25 0 1 0 2.5,0 a 1.25,1.25 0 1 0 -2.5,0 Z M 103.5,66 a 1.5,1.5 0 1 0 3,0 a 1.5,1.5 0 1 0 -3,0 Z M 96.75,122 a 1.25,1.25 0 1 0 2.5,0 a 1.25,1.25 0 1 0 -2.5,0 Z M 103.75,122 a 1.25,1.25 0 1 0 2.5,0 a 1.25,1.25 0 1 0 -2.5,0 Z M 110.75,122 a 1.25,1.25 0 1 0 2.5,0 a 1.25,1.25 0 1 0 -2.5,0 Z"/>
</g>
<g id="FOLD" fill="none" stroke="#e2001a" stroke-width="0.25">
  <line x1="93" y1="0" x2="93" y2="132"/>
  <line x1="117" y1="0" x2="117" y2="132"/>
  <line x1="210" y1="0" x2="210" y2="132"/>
  <line x1="220" y1="0" x2="220" y2="132" stroke-dasharray="4 3"/>
</g>
</svg>
